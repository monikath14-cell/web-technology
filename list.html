<!DOCTYPE html>
<html>
<head>
    <title>Description Lists</title>
</head>
<body>
    <h1>Description Lists</h1>
    <dl>
        <dt>Foods</dt>
        <dd> I like pizza </dd>

        <dt>Drinks</dt>
        <dd>I like soda </dd>
    </dl>
    <h3>Nested Description Lists</h3>
    <ul>
        <li>Foods</li>
        <ul>
            <li>I like pizza</li>
        </ul>
        <li>Drinks</li>
        <ul>
            <li>I like soda</li>
        </ul>
    </ul>
</body>
</html>
