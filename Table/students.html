<!DOCTYPE html>
<html >
<head>
    
    <title>Simple table</title>
</head>
<body>
    <table border="20" style="text-align: center;">
        <tr>
            <th rowspan="2">S.N</th>
            <th rowspan="2">Name</th>
            <th rowspan="2">Semester</th>
            <th colspan="3">Subject</th>
        </tr>
        <tr>
            <th>WT</th>
            <th>Java</th>
            <th>DSA</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Ram</td>
            <td>IV</td>
            <td>80</td>
            <td>90</td>
            <td>70</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Sita</td>
            <td rowspan="2">V</td>
            <td>60</td>
            <td>50</td> 
            <td>40</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Hari</td>
            <td>70</td>
            <td>80</td> 
            <td>70</td>
        </tr>
        <tr>
            <td colspan="6">All the best</td>
            
        </tr>
            
    </table>
    
</body>
</html>
